    body {

      background:
        radial-gradient(circle at 18% 0%, rgba(34, 211, 238, 0.22) 0%, transparent 44%),
        radial-gradient(circle at 82% 8%, rgba(251, 191, 36, 0.15) 0%, transparent 40%),

      min-height: 100vh;
      color: #f8fafc;
    }
    .header-bar {
      background: rgba(11, 19, 43, 0.90);
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(2, 6, 23, 0.55);
    }
    .game-card-thumb {
      box-shadow: 0 12px 26px rgba(2, 6, 23, 0.60), 0 0 0 1px rgba(56, 189, 248, 0.25);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
    }
    .game-card:hover .game-card-thumb,
    .game-card:focus-visible .game-card-thumb {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 18px 36px rgba(6, 182, 212, 0.35), 0 0 0 3px #22d3ee;
    }
    .game-card:active .game-card-thumb {
      transform: scale(0.97);
    }
    .volt-pill {
      background: linear-gradient(180deg, #fde047 0%, #f59e0b 100%);
      color: #0f172a;
      box-shadow: 0 3px 0 #b45309, 0 6px 16px rgba(245, 158, 11, 0.30);
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
    }
    .volt-pill:hover {
      filter: brightness(1.06);
    }
    .volt-pill:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #b45309, 0 2px 6px rgba(245, 158, 11, 0.25);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

        thumbClass: 'scale-[1.24]'
      }
    ];

    let activeCategory = 'All';
    let searchQuery = '';

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderCategories() {
      const categories = ['All', ...new Set(GAMES.map(g => g.category).filter(Boolean))];
      const container = document.getElementById('categoryTabs');
      container.innerHTML = '';

      categories.forEach(cat => {
        const active = activeCategory === cat;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = cat;
        btn.className = active
          ? 'px-4 py-1.5 rounded-full text-xs sm:text-sm font-extrabold bg-gradient-to-r from-cyan-400 to-sky-400 text-slate-950 shadow-lg shadow-cyan-500/25 transition flex-shrink-0'
          : 'px-4 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-slate-800/75 hover:bg-slate-800 text-cyan-100 border border-cyan-400/20 transition flex-shrink-0';
        btn.addEventListener('click', () => {
          activeCategory = cat;
          renderCategories();
          renderGrid();
        });
        container.appendChild(btn);
      });
    }

    function renderGrid() {
      const q = searchQuery.trim().toLowerCase();
      const filtered = GAMES.filter(g => {
        const matchesCat = activeCategory === 'All' || g.category === activeCategory;
        const matchesQ = !q || g.title.toLowerCase().includes(q) || (g.category || '').toLowerCase().includes(q);
        return matchesCat && matchesQ;
      });

      const countBadge = document.getElementById('gameCountBadge');
      countBadge.textContent = `${filtered.length} ${filtered.length === 1 ? 'Game' : 'Games'}`;

      const grid = document.getElementById('gamesGrid');
      const empty = document.getElementById('emptyState');
      grid.innerHTML = '';

      if (filtered.length === 0) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      filtered.forEach(game => {
        const card = document.createElement('a');
        card.href = game.url;
        card.target = '_blank';
        card.rel = 'noopener noreferrer';
        card.className = 'game-card group flex flex-col items-center text-center focus:outline-none w-full';
        card.innerHTML = `
          <div class="game-card-thumb relative w-full aspect-square rounded-[22px] overflow-hidden bg-slate-900">
            <img src="${game.thumb}" alt="${escapeHtml(game.title)}" class="w-full h-full object-cover ${game.thumbClass || 'scale-105'}" />
            <div class="absolute inset-0 bg-slate-950/0 group-hover:bg-slate-950/25 transition flex items-center justify-center">
              <span class="opacity-0 group-hover:opacity-100 transition transform scale-90 group-hover:scale-100 px-4 py-1.5 rounded-full bg-gradient-to-r from-amber-400 to-yellow-300 text-slate-950 text-xs font-extrabold shadow-lg">
                PLAY NOW
              </span>
            </div>
          </div>
          <span class="mt-3 text-sm sm:text-base font-bold text-white leading-snug tracking-tight drop-shadow-sm line-clamp-2">
            ${escapeHtml(game.title)}
          </span>
          <span class="mt-0.5 text-[11px] font-semibold text-cyan-300/85 uppercase tracking-wider">
            ${escapeHtml(game.category)}
          </span>
        `;
        grid.appendChild(card);
      });
    }

    // Event Listeners
    document.getElementById('logoBtn').addEventListener('click', () => {
      activeCategory = 'All';
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      renderCategories();
      renderGrid();
    });

    document.getElementById('searchToggleBtn').addEventListener('click', () => {
      const wrap = document.getElementById('searchBarWrap');
      wrap.classList.toggle('hidden');
      if (!wrap.classList.contains('hidden')) {
        document.getElementById('searchInput').focus();
      }
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderGrid();
    });

    document.getElementById('clearSearchBtn').addEventListener('click', () => {
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      renderGrid();
    });

    document.getElementById('resetFiltersBtn').addEventListener('click', () => {
      activeCategory = 'All';
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      renderCategories();
      renderGrid();
    });

    // Live Animated AetherVolt Energy Background
    let bgAnimId = null;
    function initBgAnimation() {
      const canvas = document.getElementById('bgCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let w = 0, h = 0, t = 0;
      const particles = [];
      const PARTICLE_COUNT = 46;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const isGold = i % 3 === 0;
        particles.push({
          x: Math.random() * 1400,
          y: Math.random() * 900,
          vx: (Math.random() - 0.5) * 0.55,
          vy: -0.25 - Math.random() * 0.45,
          r: 1.4 + Math.random() * 2.4,
          color: isGold ? '251, 191, 36' : '34, 211, 238',
          alpha: 0.35 + Math.random() * 0.45
        });
      }

      function drawWave(yOffset, amp, freq, speed, color, lineWidth) {
        ctx.beginPath();
        for (let x = 0; x <= w + 20; x += 20) {
          const y = yOffset + Math.sin(x * freq + t * speed) * amp + Math.cos(x * freq * 0.5 - t * speed * 0.7) * (amp * 0.5);
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = color;
        ctx.lineWidth = lineWidth;
        ctx.stroke();
      }

      function frame() {
        t += 0.016;
        ctx.clearRect(0, 0, w, h);

        drawWave(h * 0.28, 36, 0.0045, 1.1, 'rgba(34, 211, 238, 0.11)', 2.5);
        drawWave(h * 0.52, 44, 0.0035, -0.85, 'rgba(251, 191, 36, 0.08)', 2.0);
        drawWave(h * 0.76, 30, 0.005, 1.35, 'rgba(56, 189, 248, 0.09)', 1.8);

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          if (p.y < -20) { p.y = h + 20; p.x = Math.random() * w; }
          if (p.x < -20) p.x = w + 20;
          if (p.x > w + 20) p.x = -20;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${p.color}, ${p.alpha})`;
          ctx.fill();

          for (let j = i + 1; j < particles.length; j++) {
            const q = particles[j];
            const dx = p.x - q.x;
            const dy = p.y - q.y;
            const dist = Math.hypot(dx, dy);
            if (dist < 130) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(q.x, q.y);
              ctx.strokeStyle = `rgba(34, 211, 238, ${(1 - dist / 130) * 0.14})`;
              ctx.lineWidth = 1;
              ctx.stroke();
            }
          }
        }

        bgAnimId = requestAnimationFrame(frame);
      }

      resize();
      window.addEventListener('resize', resize);
      if (bgAnimId) cancelAnimationFrame(bgAnimId);
      frame();
    }

    // Initialize
    renderCategories();
    renderGrid();
    initBgAnimation();
  </script>
